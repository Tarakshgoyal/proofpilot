# Judge / demo mode — ZERO credentials required.
#   docker compose up   ->  http://localhost:8000
# Runs in fixture mode: cases replay from recorded sandbox responses
# (fixtures/), analyses use the deterministic rules engine when no LLM key
# is present, and a Postgres runs alongside. Nothing touches PayPal.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=fixture
      - RUN_WORKER_IN_APP=1
      - SEED_ON_START=1
      - DATABASE_URL=postgresql://proofpilot:proofpilot@db:5432/proofpilot
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=proofpilot
      - POSTGRES_PASSWORD=proofpilot
      - POSTGRES_DB=proofpilot
