services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=${APP_MODE:-fixture}
      - DATABASE_URL=postgresql+psycopg2://proofpilot:proofpilot@db:5432/proofpilot
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=proofpilot
      - POSTGRES_PASSWORD=proofpilot
      - POSTGRES_DB=proofpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
