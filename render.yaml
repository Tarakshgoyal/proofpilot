services:
  - type: web
    name: proofpilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proofpilot-db
          property: connectionString
      - key: APP_MODE
        value: live
      - key: RUN_WORKER_IN_APP
        value: "1"
      - key: SEED_ON_START
        value: "1"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BUYER_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: pserv
    name: proofpilot-db
    runtime: postgresql
    plan: basic-256mb
