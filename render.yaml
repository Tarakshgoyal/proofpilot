services:
  - type: web
    name: proofpilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                # kept awake by .github/workflows/keepalive.yml
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false           # Neon Postgres pooled connection string
      - key: APP_MODE
        value: live
      - key: RUN_WORKER_IN_APP
        value: "1"
      - key: SEED_ON_START
        value: "1"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BUYER_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
